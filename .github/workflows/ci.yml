# Checks every pull request into staging or main, and both branches after a
# merge. Deploys are handled by Vercel's Git integration, not here: main ships
# to production, staging to its own preview URL, and every pull request gets
# a preview of its own.
#
# Flow: feature branch -> PR into staging -> check the staging URL ->
# PR staging into main -> production.
name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

# A newer push to the same branch cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # The build needs no secrets: /api/ask reads its Google Cloud settings
      # per request, at runtime.
      - name: Build
        run: npm run build
